<!doctype html>
<html lang="en" class="h-full bg-background text-foreground scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threetides</title>
    <script>
      const stored = localStorage.getItem("darkMode")
      if (stored !== null) {
        document.documentElement.dataset.theme = JSON.parse(stored) ? "dark" : "light"
      }
    </script>
  </head>

  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
