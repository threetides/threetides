<!doctype html>
<html lang="en" class="h-full bg-background text-foreground scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threetides</title>
    <meta
      name="description"
      content="Threetides is an independent studio and a home for open-source projects, from apps to developer tools. Made in Norway."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Threetides" />
    <meta
      property="og:description"
      content="Threetides is an independent studio and a home for open-source projects, from apps to developer tools. Made in Norway."
    />
    <script>
      const theme = localStorage.getItem("theme")
      if (theme) {
        if (
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark")
      } else {
        document.documentElement.classList.toggle(
          "dark",
          window.matchMedia("(prefers-color-scheme: dark)").matches
        )
      }
    </script>
  </head>

  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
